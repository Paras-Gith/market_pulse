[tool.ruff]
target-version = "py310"
line-length = 100
src = ["app", "scripts", "tests"]
extend-exclude = [".venv", "audit-logs", "marketpulse.db"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "ASYNC",
]
ignore = [
    "B008", # FastAPI dependencies are declared with Depends in route signatures.
    "E501", # Ruff's formatter handles layout; long literals are not always wrappable.
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["app", "scripts", "tests"]
exclude = [
    "**/.venv",
    "**/__pycache__",
    "audit-logs",
]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
