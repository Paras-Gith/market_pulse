name: CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff lint
        run: ruff check app scripts tests

      - name: Check formatting on changed Python files
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only --diff-filter=ACMRT "$base" "$HEAD_SHA" -- '*.py')"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "Pull request base commit is unavailable: $base" >&2
            exit 1
          else
            echo "No prior commit is available; skipping changed-file formatting on this initial push."
            exit 0
          fi
          if [[ -n "$files" ]]; then
            while IFS= read -r file; do
              if [[ -f "$file" ]]; then
                ruff format --check "$file"
              fi
            done <<< "$files"
          fi

      - name: Check strict typing against approved baseline
        run: python scripts/check_pyright.py

      - name: Run tests
        run: python -m pytest -q

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compatibility:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
